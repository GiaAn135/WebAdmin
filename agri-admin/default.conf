server {
    listen 80;
    server_name localhost staging.agrii.asia;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    # Redirect all HTTP to HTTPS (except ACME challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/ssl/certs/nong-dan-so.crt;
    ssl_certificate_key /etc/ssl/certs/nong-dan-so.key;

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass nong_dan_so_app:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Block hidden files
    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name staging.agrii.asia;

    root /var/www/html/public;
    index index.php index.html;

    # Let's Encrypt certificate
    ssl_certificate /etc/ssl/certs/live/staging.agrii.asia/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/live/staging.agrii.asia/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass nong_dan_so_app:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Block hidden files
    location ~ /\.ht {
        deny all;
    }
}
